<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScalerSync | Student Dashboard</title>

  <!-- Apply saved theme before first paint to avoid a flash -->
  <script>
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("scalersync-theme");
        if (saved === "light" || saved === "dark") {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          theme = "light";
        }
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Source Sans 3", "ui-sans-serif", "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans antialiased min-h-screen">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 shrink-0 hidden md:flex flex-col">
      <div class="sidebar-brand px-5 py-5">
        <a href="#board" class="brand-link" aria-label="ScalerSync home">
          <!-- Paste your logo file paths into the two src values below.
               Dark mode uses the white-text logo; light mode needs a dark-text version. -->
          <img class="brand-logo logo-for-dark" src="LOGO_DARK_PATH_HERE" alt="ScalerSync">
          <img class="brand-logo logo-for-light" src="LOGO_LIGHT_PATH_HERE" alt="ScalerSync">
        </a>
      </div>

      <nav class="flex-1 px-3 py-5 space-y-1" aria-label="Dashboard">
        <a class="nav-link is-active" href="#board" data-filter="ALL">Overview</a>
        <a class="nav-link" href="#critical" data-filter="CRITICAL">Critical</a>
        <a class="nav-link" href="#events" data-filter="EVENT">Events</a>
        <a class="nav-link" href="#news" data-filter="NEWS">News</a>
      </nav>

      <div class="sidebar-foot px-5 py-5">
        <p class="foot-title">Sources</p>
        <p class="mt-2 text-xs leading-relaxed foot-text">WhatsApp export · Scaler.com · SST dashboard · NLogN</p>
      </div>
    </aside>

    <div class="flex-1 min-w-0">
      <header class="topbar sticky top-0 z-10">
        <div class="px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <button id="menu-toggle" class="icon-btn md:hidden" type="button" aria-label="Toggle navigation">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div>
              <h1 class="page-title">Student dashboard</h1>
              <p class="page-sub">Deadlines, events, and campus news in one feed.</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span id="status-pill" class="status-pill">Loading</span>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="true" aria-label="Switch to light mode" title="Switch theme">
              <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
              <span class="theme-label">Light</span>
            </button>
            <span class="avatar hidden sm:inline-flex" aria-hidden="true">SS</span>
          </div>
        </div>
      </header>

      <main id="board" class="p-4 sm:p-6">
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <article id="critical" class="column column-critical">
            <header class="column-head">
              <h2>Critical Deadlines</h2>
              <span id="count-CRITICAL" class="count">0</span>
            </header>
            <div id="list-CRITICAL" class="card-list"></div>
          </article>

          <article id="events" class="column column-event">
            <header class="column-head">
              <h2>Upcoming Events</h2>
              <span id="count-EVENT" class="count">0</span>
            </header>
            <div id="list-EVENT" class="card-list"></div>
          </article>

          <article id="news" class="column column-news">
            <header class="column-head">
              <h2>Campus News</h2>
              <span id="count-NEWS" class="count">0</span>
            </header>
            <div id="list-NEWS" class="card-list"></div>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById("theme-toggle");
      var label = btn.querySelector(".theme-label");

      function sync() {
        var dark = root.getAttribute("data-theme") === "dark";
        btn.setAttribute("aria-pressed", String(dark));
        btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
        label.textContent = dark ? "Light" : "Dark";
      }

      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("scalersync-theme", next); } catch (e) {}
        sync();
      });

      sync();
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
